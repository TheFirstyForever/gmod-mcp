[package]
name = "gmod-mcp"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "MCP server bridging a running Garry's Mod instance (in-game gmod_mcp addon + MCP front-end)"

[dependencies]
serde_json = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["tga", "jpeg"] }

[profile.release]
opt-level = 2
